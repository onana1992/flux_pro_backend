spring.application.name=flux-pro-backend
server.port=8080

# --- i18n (messages d'erreur/succès traduits selon Accept-Language, cf. LocaleConfig) ---
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=false
spring.messages.use-code-as-default-message=true

# --- MySQL (local) ---
#spring.datasource.url=jdbc:mysql://localhost:3306/fluxpro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.username=core
#spring.datasource.password=core2025
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- PostgreSQL (Neon) — surcharger via SPRING_DATASOURCE_* si besoin ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cold-dream-axlsjsbj.c-4.us-east-2.aws.neon.tech:5432/neondb?sslmode=require&options=endpoint%3Dep-cold-dream-axlsjsbj}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_fAaoyH4hSb7w}
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon : pool raisonnable (connexion serverless)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
fluxpro.jwt.secret=FluxProMINTPDevSecretKey2025MustBeAtLeast256BitsLongForHS256Algorithm!!
fluxpro.jwt.access-expiration-ms=28800000
fluxpro.jwt.refresh-expiration-ms=604800000

# --- CORS ---
fluxpro.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001

# --- Swagger / OpenAPI (springdoc) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=false

# --- Pièces jointes : local | s3 (voir docs/GUIDE-IMPLEMENTATION-STOCKAGE-S3.md) ---
fluxpro.attachments.storage=${FLUXPRO_ATTACHMENTS_STORAGE:s3}
fluxpro.attachments.storage-path=${FLUXPRO_ATTACHMENTS_PATH:./data/attachments}
fluxpro.attachments.s3.bucket=${FLUXPRO_S3_BUCKET:fluxpro-attachments-pilote}
fluxpro.attachments.s3.region=${FLUXPRO_S3_REGION:us-east-1}
# Secrets : préférer AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (env) ou application-secrets.properties (gitignored)
fluxpro.attachments.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
fluxpro.attachments.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
spring.config.import=optional:file:./application-secrets.properties
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=22MB

# --- Horloge système (mode test : artificial clock en DB, tick réel) ---
# normal = Instant.now() réel | test = horloge stockée (docs/sql/2026-07-14_system_clock.sql)
# Profil Spring alternatif : --spring.profiles.active=test (cf. application-test.properties)
fluxpro.clock.mode=${FLUXPRO_CLOCK_MODE:test}
# Poll mur pour détecter les créneaux cron franchis par l'horloge (réelle ou simulée)
fluxpro.clock.job-poll-ms=5000

# --- Tenant / déploiement (seed si table tenant_settings vide) ---
fluxpro.tenant.name=${FLUXPRO_TENANT_NAME:MINTP Cameroun}
fluxpro.tenant.product-name=${FLUXPRO_PRODUCT_NAME:FluxPro}
fluxpro.tenant.timezone=${FLUXPRO_TENANT_TIMEZONE:Africa/Douala}
fluxpro.tenant.country-code=${FLUXPRO_TENANT_COUNTRY:CM}
fluxpro.tenant.reference-prefix=${FLUXPRO_REFERENCE_PREFIX:MINTP}
fluxpro.tenant.badge=${FLUXPRO_TENANT_BADGE:Déploiement pilote · MINTP Cameroun}

# --- Alertes et escalade (ALR) ---
# SMTP (secrets : préférer variables d'environnement)
spring.mail.host=${MINTP_SMTP_HOST:mx-dc03.ewodi.net}
spring.mail.port=${MINTP_SMTP_PORT:587}
spring.mail.username=${MINTP_SMTP_USER:joejunior@nano-tech.cm}
spring.mail.password=${MINTP_SMTP_PASSWORD:Canada2026@}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Échec rapide si SMTP injoignable (évite de bloquer création / transmission ~20s)
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# from / redirect : seed tenant_settings (modifiables dans Paramètres → Organisation)
fluxpro.alerts.from-address=${FLUXPRO_ALERTS_FROM:joejunior@nano-tech.cm}
fluxpro.alerts.email-redirect-to=${FLUXPRO_EMAIL_REDIRECT_TO:brunoesso@nano-tech.cm}
# URL front pour liens « Ouvrir le dossier » dans les emails (sans slash final)
fluxpro.alerts.app-base-url=${FLUXPRO_APP_BASE_URL:http://localhost:3000}
# Fréquence d'évaluation du moteur d'alertes (ALR-01 à ALR-04)
fluxpro.alerts.scheduler.cron=0 0/30 7-18 * * MON-FRI
# Récapitulatif quotidien des retards (ALR-08) — 7h30, lun-ven
fluxpro.alerts.digest.cron=0 30 7 * * MON-FRI
# Rôle(s) destinataire(s) du digest : seed initial si la table alert_digest_recipient_role est vide
# (la liste effective est ensuite gérée dans Paramètres → Digest)
# --- Portail (OTP externe) ---
fluxpro.portal.otp.ttl-seconds=600
fluxpro.portal.otp.length=6

# --- Assistant IA (Sprint 0) — kill-switch + OpenAI ---
# Clé / modèle : à définir dans application-secrets.properties ou variables d'env.
# Ne PAS fixer spring.ai.model.chat=none ici : ça écrase les secrets importés.
fluxpro.assistant.enabled=${FLUXPRO_ASSISTANT_ENABLED:false}
fluxpro.assistant.timeout-seconds=${FLUXPRO_ASSISTANT_TIMEOUT:60}
fluxpro.assistant.max-history-messages=${FLUXPRO_ASSISTANT_MAX_HISTORY:10}
fluxpro.assistant.max-tool-calls=${FLUXPRO_ASSISTANT_MAX_TOOL_CALLS:5}
fluxpro.assistant.rate-limit-per-hour=${FLUXPRO_ASSISTANT_RATE_LIMIT:30}
spring.ai.openai.chat.model=${FLUXPRO_ASSISTANT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.temperature=0.2
